<style>

  @keyframes eq { 0%, 100% { transform: scaleY(.3); } 50% { transform: scaleY(1); } }

  /* ---------- intro ---------- */

    position: fixed; inset: 0; z-index: 20;
    display: grid; place-items: center; text-align: center;
    padding-inline: 20px;

  .intro-inner { display: flex; flex-direction: column; align-items: center; gap: 18px; max-width: 520px; }
  .intro .mono { color: var(--muted); }

  /* ---------- the sheet ---------- */
  .sheet {
    position: fixed; z-index: 25; left: 0; right: 0; bottom: 0;
    margin-inline: auto; width: min(100%, 560px);

  .handle { width: 40px; height: 4px; border-radius: 4px; background: #e4d2d4; margin: 0 auto 18px; }
  .sheet .mono { color: var(--paper-muted); }
  .note { margin: 14px 0 0; }
  .note p { font-family: var(--serif); font-size: clamp(26px, 7.2vw, 32px); line-height: 1.12; margin: 0 0 10px; letter-spacing: -.005em; text-wrap: pretty; }
  .note p + p { font-size: clamp(21px, 5.6vw, 24px); color: #4b2a40; }
  .sig { font-family: var(--hand); font-size: 24px; color: var(--rose-deep); margin: 14px 0 0; clip-path: inset(0 100% 0 0); line-height: 1.6; }
  .rule { display: flex; align-items: center; gap: 12px; margin: 24px 0 18px; color: #c9a9b3; }
  .rule::before, .rule::after { content: ""; flex: 1; height: 1px; background: #ead9da; }
  .later { display: flex; flex-direction: column; gap: 16px; opacity: 0; }

  .scratch {
    position: relative; height: 138px; border-radius: 20px; overflow: hidden;

  .prize { position: absolute; inset: 0; display: grid; place-content: center; gap: 6px; text-align: center; padding: 14px; }
  .prize strong { font-family: var(--serif); font-weight: 400; font-size: 28px; line-height: 1.05; color: var(--rose-deep); }
  .prize span { font-size: 14px; color: var(--paper-muted); }
  .scratch canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; transition: opacity .7s var(--ease); }
  .scratch canvas.gone { opacity: 0; pointer-events: none; }

  .fortune { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 18px 12px; border-radius: 20px; background: var(--paper-2); }
  .cookie { position: relative; width: 70px; height: 64px; }
  .cookie .half { position: absolute; inset: 0; font-size: 56px; line-height: 64px; text-align: center; transition: transform .7s var(--ease); }
  .cookie .l { clip-path: inset(0 50% 0 0); }
  .cookie .r { clip-path: inset(0 0 0 50%); }
  .fortune.cracked .l { transform: translateX(-16px) rotate(-22deg); }
  .fortune.cracked .r { transform: translateX(16px) rotate(22deg); }
  .slip {
    margin: 0; background: #fff; color: var(--paper-ink); padding: 10px 16px; border-radius: 4px;
    font-family: var(--serif); font-style: italic; font-size: 21px; line-height: 1.2; text-align: center;
    box-shadow: 0 6px 16px -10px rgba(42, 20, 38, .4);
    transform-origin: center; transform: scaleX(0);
    transition: transform .6s .25s var(--ease);
  }
  .fortune.cracked .slip { transform: scaleX(1); }

  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tile {
    display: flex; align-items: center; gap: 10px; cursor: pointer; text-decoration: none;
    min-height: 56px; padding: 12px 14px; border-radius: 16px; border: 0;
    background: var(--paper-2); color: var(--paper-ink); font-size: 14.5px; font-weight: 500; text-align: left;
  }
  .tile svg { flex: none; width: 20px; height: 20px; }
  .tile.primary { grid-column: 1 / -1; justify-content: center; background: var(--paper-ink); color: var(--paper); }
  .tile:focus-visible, .linkish:focus-visible { outline: 2px solid var(--rose-deep); outline-offset: 2px; }
  .linkish { background: none; border: 0; cursor: pointer; color: var(--paper-muted); text-decoration: underline; text-underline-offset: 3px; font-size: 14px; justify-self: center; padding: 6px; }
  .tips { text-align: center; margin: 0; }
  .tips button { background: none; border: 0; padding: 0; color: var(--rose-deep); font: inherit; letter-spacing: inherit; text-transform: inherit; text-decoration: underline; cursor: pointer; }

  .toast {
    position: fixed; z-index: 50; left: 50%; top: calc(64px + env(safe-area-inset-top, 0px));
    transform: translateX(-50%); max-width: calc(100% - 32px);
    padding: 10px 16px; border-radius: 99px; font-size: 14px;
    background: var(--glass); border: 1px solid var(--line); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    opacity: 0; pointer-events: none; transition: opacity .3s;
  }
  .toast.show { opacity: 1; }

  @media (min-width: 700px) {
    .sheet { bottom: 24px; border-radius: 28px; max-height: calc(100vh - 110px); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>

<script>

    let ac = null, master, wet, enabled = true, noiseBuf, voices = [];

      const len = Math.floor(ac.sampleRate * sec), b = ac.createBuffer(2, len, ac.sampleRate);

    function ctx() {
      if (!ac) {
        try {
          ac = new (window.AudioContext || window.webkitAudioContext)();
          master = ac.createGain(); master.gain.value = .85;
          const comp = ac.createDynamicsCompressor();
          master.connect(comp); comp.connect(ac.destination);
          const conv = ac.createConvolver(); conv.buffer = impulse(2.8);
          wet = ac.createGain(); wet.gain.value = .3;
          wet.connect(conv); conv.connect(master);
          noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);

          for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;

      if (ac.state === 'suspended') ac.resume();
      return ac;

    const ok = () => enabled && ctx();
    function route(node, rev) {
      node.connect(master);
      if (rev) { const r = ac.createGain(); r.gain.value = rev; node.connect(r); r.connect(wet); }

    function track(src) {
      voices.push(src);
      src.onended = () => { const i = voices.indexOf(src); if (i >= 0) voices.splice(i, 1); };

      const o = ac.createOscillator(), g = ac.createGain();

  async function startMic() {
    const btn = $('#micBtn'), label = btn.querySelector('span');

class Particles {
  constructor(max, blending, core) {
    this.max = max; this.n = 0;
    this.parts = Array.from({ length: max }, () => ({}));
    this.pos = new Float32Array(max * 3); this.col = new Float32Array(max * 3);
    this.size = new Float32Array(max); this.alpha = new Float32Array(max);
    const g = new THREE.BufferGeometry();
    this.aPos = new THREE.BufferAttribute(this.pos, 3).setUsage(THREE.DynamicDrawUsage);
    this.aCol = new THREE.BufferAttribute(this.col, 3).setUsage(THREE.DynamicDrawUsage);
    this.aSize = new THREE.BufferAttribute(this.size, 1).setUsage(THREE.DynamicDrawUsage);
    this.aAlpha = new THREE.BufferAttribute(this.alpha, 1).setUsage(THREE.DynamicDrawUsage);
    g.setAttribute('position', this.aPos); g.setAttribute('aColor', this.aCol);
    g.setAttribute('aSize', this.aSize); g.setAttribute('aAlpha', this.aAlpha);
    g.setDrawRange(0, 0);
    this.mat = new THREE.ShaderMaterial({
      uniforms: { uScale: { value: 400 } },
      vertexShader: `attribute float aSize; attribute float aAlpha; attribute vec3 aColor; uniform float uScale;
        varying vec3 vColor; varying float vAlpha;
        void main(){ vColor = aColor; vAlpha = aAlpha; vec4 mv = modelViewMatrix * vec4(position, 1.0);
          gl_PointSize = aSize * uScale / -mv.z; gl_Position = projectionMatrix * mv; }`,
      fragmentShader: `varying vec3 vColor; varying float vAlpha;
        void main(){ float d = length(gl_PointCoord - 0.5) * 2.0; if (d > 1.0) discard;
          float glow = pow(1.0 - d, 2.2);
          float core = ${core ? 'smoothstep(0.35, 0.0, d)' : '0.0'};
          gl_FragColor = vec4(vColor * glow + vec3(1.0, 0.95, 0.88) * core, vAlpha * ${core ? '(glow + core)' : 'smoothstep(1.0, 0.2, d) * 0.5'});
          #include <colorspace_fragment>
        }`,
      transparent: true, depthWrite: false, blending, fog: false, toneMapped: false
    });
    this.points = new THREE.Points(g, this.mat); this.points.frustumCulled = false;
    this.points.renderOrder = 5;
    scene.add(this.points);
  }
  spawn(o) {
    if (this.n >= this.max) return null;
    const p = this.parts[this.n++];
    p.mode = 0; p.x = o.x; p.y = o.y; p.z = o.z;
    p.vx = o.vx || 0; p.vy = o.vy || 0; p.vz = o.vz || 0;
    p.r = o.c.r; p.g = o.c.g; p.b = o.c.b;
    p.size = o.size || .06; p.grow = o.grow || 0; p.a0 = o.a == null ? 1 : o.a; p.alpha = p.a0;
    p.life = 0; p.max = o.max || 1; p.drag = o.drag == null ? .5 : o.drag; p.grav = o.grav || 0;
    p.twinkle = o.twinkle || 0; p.ph = Math.random() * 6.28;
    if (o.target) {
      p.mode = 1; p.ox = o.x; p.oy = o.y; p.oz = o.z; p.tx = o.target[0]; p.ty = o.target[1]; p.tz = o.target[2];
      p.t0 = o.t0; p.fly = o.fly; p.hold = o.hold; p.wx = rand(-.6, .6); p.wy = rand(-.4, .6); p.wz = rand(-.4, .4);
    }
    return p;
  }
  update(dt, now) {
    let i = 0;
    while (i < this.n) {
      const p = this.parts[i];
      if (p.mode === 1) {
        const t = now - p.t0;
        if (t < 0) p.alpha = 0;
        else if (t < p.fly) {
          const k = t / p.fly, e = 1 - Math.pow(1 - k, 3), s = Math.sin(k * Math.PI);
          p.x = p.ox + (p.tx - p.ox) * e + p.wx * s; p.y = p.oy + (p.ty - p.oy) * e + p.wy * s; p.z = p.oz + (p.tz - p.oz) * e + p.wz * s;
          p.alpha = p.a0;
        } else if (t < p.fly + p.hold) {
          p.x = p.tx; p.y = p.ty; p.z = p.tz;
          p.alpha = p.a0 * (.62 + .38 * Math.sin(now * 7 + p.ph));
        } else {
          p.mode = 0; p.vx = rand(-.08, .08); p.vy = rand(-.12, 0); p.vz = rand(-.08, .08);
          p.grav = -.22; p.drag = .7; p.life = 0; p.max = rand(2, 3.4); p.twinkle = 1;
        }
      }
      if (p.mode === 0) {
        p.life += dt;
        if (p.life >= p.max) {
          this.n--; const last = this.parts[this.n]; this.parts[this.n] = p; this.parts[i] = last;
          continue;
        }
        const dr = Math.pow(p.drag, dt);
        p.vx *= dr; p.vy = p.vy * dr + p.grav * dt; p.vz *= dr;
        p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
        p.size += p.grow * dt;
        const k = p.life / p.max;
        p.alpha = p.a0 * (1 - k * k) * (p.twinkle ? (.5 + .5 * Math.sin(now * 22 + p.ph)) : 1);
      }
      const j = i * 3;
      this.pos[j] = p.x; this.pos[j + 1] = p.y; this.pos[j + 2] = p.z;
      this.col[j] = p.r; this.col[j + 1] = p.g; this.col[j + 2] = p.b;
      this.size[i] = p.size; this.alpha[i] = p.alpha;
      i++;
    }
    this.points.geometry.setDrawRange(0, this.n);
    if (this.n) {
      this.aPos.needsUpdate = this.aCol.needsUpdate = this.aSize.needsUpdate = this.aAlpha.needsUpdate = true;
    }
  }
}

/* ================= name targets for the fireworks ================= */
const NAME_Y = 3.35, NAME_Z = -1.4;
async function nameTargets(maxPts) {
  const family = '"Instrument Serif", Georgia, serif';
  try { await document.fonts.load(`italic 200px "Instrument Serif"`); } catch (e) {}
  const cw = 1024, ch = 360, c = document.createElement('canvas'); c.width = cw; c.height = ch;
  const x = c.getContext('2d');
  let fs = 240; x.font = `italic ${fs}px ${family}`;
  const mw = x.measureText(C.name).width;
  fs = Math.min(300, fs * (cw * .86) / mw);
  x.font = `italic ${fs}px ${family}`;
  x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillStyle = '#fff'; x.strokeStyle = '#fff'; x.lineWidth = fs * .05; x.lineJoin = 'round';
  x.fillText(C.name, cw / 2, ch / 2); x.strokeText(C.name, cw / 2, ch / 2);
  const textW = x.measureText(C.name).width + x.lineWidth;
  const data = x.getImageData(0, 0, cw, ch).data;
  let pts = [];
  for (let py = 0; py < ch; py += 3) for (let px = 0; px < cw; px += 3) if (data[(py * cw + px) * 4 + 3] > 140) pts.push([px, py]);
  for (let i = pts.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pts[i], pts[j]] = [pts[j], pts[i]]; }
  pts = pts.slice(0, maxPts);
  // fit the word to the camera's view at the name's depth
  const s = SHOTS.sky(), dist = s.pos.z - NAME_Z;
  const visW = 2 * dist * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.aspect;
  const worldW = Math.min(6.2, visW * .84), k = worldW / textW;
  return pts.map(([px, py]) => [(px - cw / 2) * k, NAME_Y - (py - ch / 2) * k, NAME_Z + rand(-.06, .06)]);
}

  const L = world.level;
  hemi.intensity = baseHemi * L;
  key.intensity = baseKey * L;
  rim.intensity = baseRim * (.25 + .75 * L);
  key.color.copy(coolKey).lerp(warmKey, world.warm * .5);
  scene.environmentIntensity = .55 * L;
  sky.material.uniforms.dim.value = .35 + .65 * L;
  stars.uniforms.uDim.value = 1.25 - .25 * L;
  bokeh.uniforms.uDim.value = .5 + .5 * L;
  stars.uniforms.uTime.value = bokeh.uniforms.uTime.value = t;

  if (gift.visible && state !== 'opening') {
    gift.rotation.y = Math.sin(t * .5) * .35;
    gift.position.y = TOP + Math.max(0, Math.sin(t * 1.6)) * .04;
    giftGlow.material.opacity = .28 + Math.sin(t * 2) * .08;
  }

  lean += (leanTarget - lean) * Math.min(1, dt * 10);
  for (const c of candles) {
    const f = 1 + .07 * Math.sin(t * 23 + c.ph) + .05 * Math.sin(t * 37 + c.ph * 2) + (Math.random() - .5) * .04;
    const s = c.s;
    c.flame.scale.set(s * (1 - lean * .25), s * f * (1 - lean * .35), s);
    c.flame.rotation.z = -lean * .9 + .05 * Math.sin(t * 11 + c.ph);
    c.halo.material.opacity = .75 * s;
    c.light.intensity = 1.6 * s * (.85 + .15 * f) * (1 - lean * .4);
  }

  updateRockets(dt);
  fx.update(dt, t);
  smoke.update(dt, t);
  updateConfetti(dt, t);
  updateBalloons(dt, t);

  par.x += (par.tx - par.x) * Math.min(1, dt * 2.5);
  par.y += (par.ty - par.y) * Math.min(1, dt * 2.5);
  shake *= Math.pow(.02, dt);
  const idle = reduce ? 0 : 1;
  camera.position.set(
    cam.pos.x + par.x * .35 * idle + Math.sin(t * .23) * .12 * idle + (Math.random() - .5) * shake,
    cam.pos.y - par.y * .2 * idle + Math.sin(t * .31) * .05 * idle + (Math.random() - .5) * shake,
    cam.pos.z
  );
  camera.lookAt(cam.look);
  if (viewShift.v > .5) camera.setViewOffset(innerWidth, innerHeight, 0, viewShift.v, innerWidth, innerHeight);
  else if (camera.view && camera.view.enabled) camera.clearViewOffset();

  renderer.render(scene, camera);
}
// compile every material up front so nothing stutters mid-show
cake.visible = true; balloons.forEach(b => { b.g.visible = true; });
try { renderer.compile(scene, camera); } catch (e) {}
cake.visible = false; balloons.forEach(b => { b.g.visible = false; });
renderer.setAnimationLoop(frame);

/* ================= public API for the page ================= */
window.Scene3D = {
  start,
  get busy() { return busy || state === 'dark'; },
  setLean(v) { leanTarget = state === 'cake' ? v : 0; },
  blowNext,
  frameAbove(px) {
    sheetPx = px;
    gsap.to(viewShift, { v: px / 2, duration: 1.1, ease: 'power3.inOut' });
    if (state === 'card' || state === 'party') moveTo(px ? 'card' : 'party', 1.3, 'power3.inOut');
  },
  confettiAt(x, y) {
    ndc.set(x / innerWidth * 2 - 1, -(y / innerHeight) * 2 + 1);
    const p = new THREE.Vector3(ndc.x, ndc.y, .5).unproject(camera);
    const dir = p.sub(camera.position).normalize();
    confettiBurst(camera.position.clone().addScaledVector(dir, 3.2), 120, 2.6);
  },
  shake() { shake = .25; confettiRain(lowPower ? 90 : 160); Sound.sparkle(); },
  fireworksAgain,
  replay
};
</script>
