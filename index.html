<style>
  :root {
    color-scheme: dark;
    --night: #140b1d;
    --plum: #2a1433;
    --pearl: #fff6f4;
    --muted: rgba(255, 246, 244, .62);
    --rose: #ff8fb1;
    --gold: #f4d29a;
    --serif: "Instrument Serif", Georgia, "Times New Roman", serif;
    --sans: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
    --hand: "Homemade Apple", "Segoe Script", cursive;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden;
    background: radial-gradient(ellipse at 50% 115%, #3b1740 0%, var(--plum) 35%, var(--night) 75%);
    color: var(--pearl); font-family: var(--sans);
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #stars { animation: breathe 6s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .55; } }

  /* warm candlelight that fills the room while the candles are lit */
  #warm {
    position: fixed; inset: 0; pointer-events: none; opacity: 0;
    background: radial-gradient(circle at 50% 58%, rgba(255, 170, 110, .38) 0%, rgba(255, 120, 150, .14) 30%, transparent 62%);
    transition: opacity 1.2s ease;
  }
  #dark { position: fixed; inset: 0; pointer-events: none; background: #07030b; opacity: 0; transition: opacity 1.4s ease; }

  .stage { position: fixed; inset: 0; }

  /* one line of the story at a time */
  .line {
    position: absolute; left: 20px; right: 20px; top: 50%;
    transform: translateY(-50%);
    text-align: center; font-family: var(--serif);
    font-size: clamp(34px, 9.5vw, 56px); line-height: 1.08; letter-spacing: -.01em;
    text-wrap: balance; margin: 0;
    opacity: 0; transition: opacity .9s ease;
  }
  .line.up { top: 20%; }
  .line.show { opacity: 1; }
  .line.big { font-size: clamp(110px, 38vw, 200px); line-height: 1; font-style: italic; color: var(--gold); }
  .hint {
    position: absolute; left: 20px; right: 20px; bottom: calc(40px + env(safe-area-inset-bottom, 0px));
    text-align: center; margin: 0; font-size: 16px; color: var(--muted);
    opacity: 0; transition: opacity .8s ease;
  }
  .hint.show { opacity: 1; }

  /* start */
  .start { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 14px; padding: 20px; transition: opacity .8s ease; }
  .start .for { font-size: 13px; letter-spacing: .3em; text-transform: uppercase; color: var(--muted); margin: 0; }
  .start .name { font-family: var(--serif); font-style: italic; font-size: clamp(96px, 30vw, 170px); line-height: .9; margin: 0 0 8px; }
  .start .tap { font-size: 15px; color: var(--muted); margin: 0; animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .45; } }

  /* the cake */
  .cake {
    position: absolute; left: 50%; top: 58%;
    width: min(74vw, 300px); aspect-ratio: 280 / 250;
    transform: translate(-50%, -40%) translateY(30px); opacity: 0;
    transition: opacity 1.2s ease, transform 1.4s cubic-bezier(.2, .8, .2, 1);
    --lean: 0;
  }
  .cake.show { opacity: 1; transform: translate(-50%, -40%); }
  .cake.away { opacity: 0; transform: translate(-50%, -40%) translateY(40px) scale(.9); }
  .cake svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .flame {
    position: absolute; width: 5.4%; height: 11%; margin-left: -2.7%;
    transform-origin: 50% 100%;
    border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%;
    background: radial-gradient(ellipse at 50% 72%, #fff 0 18%, #ffe39a 32%, #ffa84d 62%, rgba(255, 120, 60, 0) 72%);
    rotate: calc(var(--lean) * 1deg);
    scale: 0;
    transition: scale .45s cubic-bezier(.3, 1.6, .5, 1), rotate .12s linear;
  }
  .flame::after {
    content: ""; position: absolute; left: 50%; top: 45%; width: 420%; height: 260%;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(255, 190, 110, .45), transparent 60%);
    border-radius: 50%;
  }
  .flame.lit { scale: 1; animation: flicker .16s ease-in-out infinite alternate; }
  .flame.out { scale: 0; transition: scale .3s ease-in; }
  @keyframes flicker { from { transform: scaleY(1) skewX(-2deg); } to { transform: scaleY(1.1) skewX(2deg); } }

  /* the note and the gift */
  .finale {
    position: absolute; left: 20px; right: 20px; top: 0; bottom: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    gap: 20px; pointer-events: none;
  }
  .note {
    width: min(100%, 420px); text-align: center;
    opacity: 0; transform: translateY(16px); transition: opacity 1.1s ease, transform 1.1s ease;
  }
  .note.show { opacity: 1; transform: none; }
  .note p { font-family: var(--serif); font-size: clamp(24px, 6.6vw, 30px); line-height: 1.2; margin: 0 0 10px; text-wrap: balance; }
  .note p + p { font-size: clamp(20px, 5.4vw, 24px); color: rgba(255, 246, 244, .85); }
  .note .sig { font-family: var(--hand); font-size: 22px; color: var(--rose); margin: 12px 0 0; clip-path: inset(0 100% 0 0); transition: clip-path 1.6s ease-in-out .6s; line-height: 1.8; }
  .note.show .sig { clip-path: inset(0 0 0 0); }

  .giftwrap { display: flex; flex-direction: column; align-items: center; gap: 12px; opacity: 0; transition: opacity 1s ease; }
  .giftwrap.show { opacity: 1; }
  .gift { position: relative; width: 92px; height: 92px; }
  .gift svg { width: 100%; height: 100%; overflow: visible; }
  .gift.shake { animation: shake .12s linear infinite; }
  @keyframes shake { 25% { transform: rotate(-4deg); } 75% { transform: rotate(4deg); } }
  .gift .lid { transition: transform .7s cubic-bezier(.3, 1.4, .5, 1), opacity .5s .3s; }
  .gift.open .lid { transform: translateY(-60px) rotate(-25deg); opacity: 0; }
  .ring { position: absolute; inset: -14px; width: calc(100% + 28px) !important; height: calc(100% + 28px) !important; }
  .ring circle { fill: none; stroke: var(--gold); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 339; stroke-dashoffset: 339; transform: rotate(-90deg); transform-origin: 60px 60px; }
  .gift-hint { margin: 0; font-size: 16px; color: var(--muted); transition: opacity .5s; }
  .prize { text-align: center; opacity: 0; transform: translateY(10px); transition: opacity .9s ease, transform .9s ease; }
  .prize.show { opacity: 1; transform: none; }
  .prize strong { display: block; font-family: var(--serif); font-weight: 400; font-size: clamp(28px, 8vw, 36px); color: var(--gold); line-height: 1.1; }
  .prize span { font-size: 15px; color: var(--muted); }
  .again { pointer-events: auto; background: none; border: 0; color: var(--muted); font: inherit; font-size: 13px; text-decoration: underline; text-underline-offset: 3px; padding: 8px; cursor: pointer; opacity: 0; transition: opacity 1s ease; }
  .again.show { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
  }
</style>

<script>
/* ============ Edit these to personalise ============ */
const CONFIG = {
  name: 'Sandie',
  from: 'Brian',
  story: ['Hey Sandie 👋', 'So… I missed your birthday.', 'Yeah. I know 😅', 'But I made you something.'],
  note: [
    'Happy belated birthday, Sandie 🎂',
    'Hope this year gives you plenty of reasons to smile.'
  ],
  prizeTitle: 'Your real gift is on its way 🎁',
  prizeSub: "Keep an eye out. It's coming soon."
};
/* =================================================== */

(() => {
  const $ = (s) => document.querySelector(s);
  const wait = (ms) => new Promise(r => setTimeout(r, ms));
  const rand = (a, b) => a + Math.random() * (b - a);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const buzz = (p) => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };

  $('#startName').textContent = CONFIG.name;
  $('#prizeTitle').textContent = CONFIG.prizeTitle;
  $('#prizeSub').textContent = CONFIG.prizeSub;
  const note = $('#note');
  for (const t of CONFIG.note) { const p = document.createElement('p'); p.textContent = t; note.appendChild(p); }
  const sig = document.createElement('p'); sig.className = 'sig'; sig.textContent = '— ' + CONFIG.from; note.appendChild(sig);

  /* ---------------- canvases ---------------- */
  const stars = $('#stars'), fx = $('#fx'), sx = stars.getContext('2d'), c = fx.getContext('2d');
  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    for (const cv of [stars, fx]) { cv.width = W * DPR; cv.height = H * DPR; }
    sx.setTransform(DPR, 0, 0, DPR, 0, 0); c.setTransform(DPR, 0, 0, DPR, 0, 0);
    sx.clearRect(0, 0, W, H);
    for (let i = 0; i < 140; i++) {
      const r = Math.random() < .9 ? rand(.4, 1) : rand(1.1, 1.7);
      sx.fillStyle = `rgba(255,${230 + Math.random() * 25 | 0},${220 + Math.random() * 35 | 0},${rand(.25, .9).toFixed(2)})`;
      sx.beginPath(); sx.arc(Math.random() * W, Math.random() * H * .8, r, 0, 7); sx.fill();
    }
  }
  resize(); addEventListener('resize', resize);

  // pre-drawn glow sprites: far cheaper than drawing shadows every frame
  function sprite(rgb) {
    const s = document.createElement('canvas'); s.width = s.height = 32;
    const g = s.getContext('2d'), gr = g.createRadialGradient(16, 16, 0, 16, 16, 16);
    gr.addColorStop(0, '#fff'); gr.addColorStop(.18, `rgba(${rgb},1)`); gr.addColorStop(.5, `rgba(${rgb},.25)`); gr.addColorStop(1, `rgba(${rgb},0)`);
    g.fillStyle = gr; g.fillRect(0, 0, 32, 32);
    return s;
  }
  const GLOW = ['244,210,154', '255,143,177', '255,236,226', '201,178,255'].map(sprite);
  const CONF = ['#ff8fb1', '#f4d29a', '#c9b2ff', '#fff6f4', '#ffc6d6'];

  let parts = [], running = false, last = 0;
  function kick() { if (!running) { running = true; last = performance.now(); requestAnimationFrame(loop); } }
  function loop(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    c.clearRect(0, 0, W, H);
    const t = now / 1000;
    let keep = 0;
    for (let i = 0; i < parts.length; i++) {
      const p = parts[i];
      if (p.kind === 'star') {
        // her name: sparkles fly from the candles to their spot, then twinkle
        const k = Math.min(1, Math.max(0, (t - p.t0) / p.fly));
        if (k <= 0) { parts[keep++] = p; continue; }
        const e = 1 - Math.pow(1 - k, 3);
        const x = p.ox + (p.tx - p.ox) * e + Math.sin(k * Math.PI) * p.wob, y = p.oy + (p.ty - p.oy) * e;
        c.globalAlpha = k < 1 ? 1 : .55 + .45 * Math.sin(t * 3 + p.ph);
        c.drawImage(GLOW[p.col], x - p.s / 2, y - p.s / 2, p.s, p.s);
      } else if (p.kind === 'spark') {
        p.life += dt; if (p.life > p.max) continue;
        p.vx *= .97; p.vy = p.vy * .97 + 60 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
        c.globalAlpha = 1 - p.life / p.max;
        c.drawImage(GLOW[p.col], p.x - p.s / 2, p.y - p.s / 2, p.s, p.s);
      } else {
        p.life += dt; if (p.y > H + 20 || p.life > 9) continue;
        p.vy = Math.min(p.vy + 380 * dt, 110); p.vx *= .98;
        p.x += (p.vx + Math.sin(t * 2 + p.ph) * 30) * dt; p.y += p.vy * dt; p.r += p.vr * dt;
        c.globalAlpha = 1;
        c.save(); c.translate(p.x, p.y); c.rotate(p.r); c.scale(1, Math.cos(t * 4 + p.ph));
        c.fillStyle = p.col; c.fillRect(-4, -2.5, 8, 5); c.restore();
      }
      parts[keep++] = p;
    }
    parts.length = keep;
    c.globalAlpha = 1;
    if (parts.length) requestAnimationFrame(loop); else { running = false; c.clearRect(0, 0, W, H); }
  }
  function confetti(n, x, y, spread = 1) {
    n = reduce ? Math.min(n, 30) : n;
    for (let i = 0; i < n; i++) {
      const a = rand(-Math.PI, 0);
      parts.push({ kind: 'conf', x, y, vx: Math.cos(a) * rand(80, 420) * spread, vy: Math.sin(a) * rand(200, 600) * spread, r: rand(0, 6), vr: rand(-8, 8), ph: rand(0, 6), col: CONF[i % CONF.length], life: 0 });
    }
    kick();
  }
  function sparks(x, y, n = 30, col = 0) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, Math.PI * 2), sp = rand(40, 180);
      parts.push({ kind: 'spark', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60, s: rand(6, 14), col, life: 0, max: rand(.5, 1.1) });
    }
    kick();
  }

  /* ---------------- sound: the tune is rendered once, then simply played back ---------------- */
  let ac = null, tuneBuf = null, tuneSrc = null, noiseBuf = null;
  function audio() {
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  }
  function renderTune() {
    const Off = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    if (!Off || !ac) return Promise.resolve(null);
    const sr = 22050, o = new Off(1, sr * 13, sr);
    const out = o.createGain(); out.gain.value = .9;
    const delay = o.createDelay(); delay.delayTime.value = .26;
    const fb = o.createGain(); fb.gain.value = .25;
    const lp = o.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2200;
    out.connect(o.destination); out.connect(delay); delay.connect(lp); lp.connect(fb); fb.connect(delay); lp.connect(o.destination);
    const N = { G4: 392, A4: 440, B4: 493.88, C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99 };
    const song = [['G4', .75], ['G4', .25], ['A4', 1], ['G4', 1], ['C5', 1], ['B4', 2], ['G4', .75], ['G4', .25], ['A4', 1], ['G4', 1], ['D5', 1], ['C5', 2],
      ['G4', .75], ['G4', .25], ['G5', 1], ['E5', 1], ['C5', 1], ['B4', 1], ['A4', 2], ['F5', .75], ['F5', .25], ['E5', 1], ['C5', 1], ['D5', 1], ['C5', 3]];
    let t = .1; const beat = .42;
    for (const [n, d] of song) {
      for (const [m, v, dec] of [[1, .16, 1.6], [2, .05, .8], [3, .015, .4]]) {
        const osc = o.createOscillator(), g = o.createGain();
        osc.frequency.value = N[n] * m;
        g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + dec);
        osc.connect(g); g.connect(out); osc.start(t); osc.stop(t + dec + .05);
      }
      t += d * beat;
    }
    try {
      const r = o.startRendering();
      if (r && r.then) return r.catch(() => null);
      return new Promise(res => { o.oncomplete = (e) => res(e.renderedBuffer); });
    } catch (e) { return Promise.resolve(null); }
  }
  function playTune(vol = .8) {
    if (!ac || !tuneBuf) return;
    stopTune();
    const s = ac.createBufferSource(), g = ac.createGain();
    s.buffer = tuneBuf; g.gain.value = vol; s.connect(g); g.connect(ac.destination); s.start();
    tuneSrc = { s, g };
  }
  function stopTune() {
    if (!tuneSrc) return;
    const { s, g } = tuneSrc; tuneSrc = null;
    try { g.gain.setTargetAtTime(0, ac.currentTime, .15); s.stop(ac.currentTime + .6); } catch (e) {}
  }
  function chime(notes) {
    if (!ac) return;
    const t0 = ac.currentTime;
    notes.forEach((f, i) => {
      const o = ac.createOscillator(), g = ac.createGain(), t = t0 + i * .12;
      o.frequency.value = f; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.08, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + 1.4);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + 1.5);
    });
  }
  function puff() {
    if (!ac) return;
    if (!noiseBuf) {
      noiseBuf = ac.createBuffer(1, ac.sampleRate * .5 | 0, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2);
    }
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.value = 900; g.gain.value = .35;
    s.connect(f); f.connect(g); g.connect(ac.destination); s.start();
  }

  /* ---------------- story helpers ---------------- */
  const line = $('#line'), hint = $('#hint');
  let skip = null;
  async function say(text, ms = 2200, cls = '') {
    line.className = 'line ' + cls;
    line.textContent = text;
    void line.offsetWidth;
    line.classList.add('show');
    await pause(ms);
    line.classList.remove('show');
    await wait(700);
  }
  // a tap anywhere hurries the current line along
  function pause(ms) {
    return new Promise(r => {
      const t = setTimeout(done, ms);
      function done() { clearTimeout(t); skip = null; r(); }
      skip = done;
    });
  }
  function setHint(text) { if (text) hint.textContent = text; hint.classList.toggle('show', !!text); }

  /* ---------------- candles + blowing ---------------- */
  const cake = $('#cake'), flames = [...document.querySelectorAll('.flame')];
  let lit = 0, blowPhase = false, micStream = null, micRaf = 0, resolveBlown = null;
  function setWarm() { $('#warm').style.opacity = String(lit / 3); }
  function blowOne() {
    const f = flames.find(x => x.classList.contains('lit'));
    if (!f) return;
    f.classList.remove('lit'); f.classList.add('out');
    lit--; setWarm(); puff(); buzz(30);
    const r = f.getBoundingClientRect();
    sparks(r.left + r.width / 2, r.top + r.height / 2, 14, 0);
    if (lit === 0) { blowPhase = false; stopMic(); cake.style.setProperty('--lean', 0); resolveBlown && resolveBlown(); }
  }
  async function askMic() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !ac) return false;
    try {
      micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
      return true;
    } catch (e) { return false; }
  }
  function listen() {
    const an = ac.createAnalyser(); an.fftSize = 512;
    ac.createMediaStreamSource(micStream).connect(an);
    const buf = new Float32Array(an.fftSize);
    const t0 = performance.now();
    let floor = .01, n = 0, strong = 0, lastOut = 0;
    const tick = (now) => {
      if (!micStream) return;
      an.getFloatTimeDomainData(buf);
      let sum = 0; for (let i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
      const rms = Math.sqrt(sum / buf.length);
      if (now - t0 < 400) floor = (floor * n + rms) / (++n);
      const th = Math.min(.18, Math.max(.05, floor * 3.5));
      cake.style.setProperty('--lean', (Math.min(1, rms / (th * 1.5)) * -38).toFixed(1));
      if (now - t0 > 400 && rms > th) {
        if (!strong) strong = now;
        if (now - strong > 150 && now - lastOut > 260) { lastOut = now; blowOne(); }
      } else strong = 0;
      micRaf = requestAnimationFrame(tick);
    };
    micRaf = requestAnimationFrame(tick);
  }
  function stopMic() {
    cancelAnimationFrame(micRaf);
    if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  }

  /* ---------------- her name in sparkles ---------------- */
  async function nameInStars(fromX, fromY) {
    try { await document.fonts.load('italic 100px "Instrument Serif"'); } catch (e) {}
    const font = (s) => `italic ${s}px "Instrument Serif", Georgia, serif`;
    const o = document.createElement('canvas'), ox = o.getContext('2d');
    const cw = Math.min(W - 40, 520);
    ox.font = font(200);
    const fs = Math.min(170, 200 * cw / ox.measureText(CONFIG.name).width);
    o.width = Math.ceil(cw); o.height = Math.ceil(fs * 1.3);
    ox.font = font(fs);
    ox.textAlign = 'center'; ox.textBaseline = 'middle'; ox.fillStyle = '#fff'; ox.strokeStyle = '#fff';
    ox.lineWidth = Math.max(2, fs * .04);
    ox.fillText(CONFIG.name, o.width / 2, o.height / 2); ox.strokeText(CONFIG.name, o.width / 2, o.height / 2);
    const d = ox.getImageData(0, 0, o.width, o.height).data;
    const step = Math.max(2, Math.round(fs / 42));
    let pts = [];
    for (let y = 0; y < o.height; y += step) for (let x = 0; x < o.width; x += step) if (d[(y * o.width + x) * 4 + 3] > 130) pts.push([x, y]);
    const max = reduce ? 300 : 900;
    if (pts.length > max) pts = pts.sort(() => Math.random() - .5).slice(0, max);
    const left = (W - o.width) / 2, top = H * .2 - o.height / 2;
    const t = performance.now() / 1000;
    for (const [x, y] of pts) {
      parts.push({ kind: 'star', ox: fromX + rand(-20, 20), oy: fromY + rand(-10, 10), tx: left + x, ty: top + y,
        t0: t + rand(0, .6), fly: rand(1.3, 2), wob: rand(-80, 80), s: rand(4.5, 8), ph: rand(0, 6),
        col: Math.random() < .6 ? 0 : (Math.random() < .5 ? 1 : 2) });
    }
    kick();
  }

  /* ---------------- hold to open the gift ---------------- */
  function holdGift() {
    return new Promise(res => {
      const gift = $('#gift'), ring = $('#ringC');
      let p = 0, holding = false, raf = 0, prev = 0, done = false;
      const step = (now) => {
        const dt = Math.min(.05, (now - prev) / 1000); prev = now;
        p = Math.max(0, Math.min(1, p + (holding ? dt / 1.4 : -dt / .6)));
        ring.style.strokeDashoffset = String(339 * (1 - p));
        gift.classList.toggle('shake', holding && p > .15);
        if (p >= 1 && !done) { done = true; finish(); return; }
        if (p > 0 || holding) raf = requestAnimationFrame(step); else raf = 0;
      };
      gift.style.pointerEvents = 'auto'; gift.style.touchAction = 'none';
      gift.addEventListener('pointerdown', (e) => {
        if (done) return;
        e.preventDefault(); holding = true; audio(); buzz([20, 60, 20, 60, 20, 60, 20]);
        if (!raf) { prev = performance.now(); raf = requestAnimationFrame(step); }
      });
      const stop = () => { holding = false; buzz(0); };
      addEventListener('pointerup', stop); addEventListener('pointercancel', stop);
      gift.addEventListener('contextmenu', (e) => e.preventDefault());
      function finish() {
        gift.classList.remove('shake'); gift.classList.add('open');
        ring.style.opacity = '0';
        buzz([30, 40, 80]); chime([1046.5, 1318.5, 1568, 2093]);
        const r = gift.getBoundingClientRect();
        confetti(120, r.left + r.width / 2, r.top + r.height / 3, 1);
        sparks(r.left + r.width / 2, r.top + r.height / 3, 30, 0);
        $('#giftHint').style.opacity = '0';
        setTimeout(() => { $('#giftHint').hidden = true; $('#prize').classList.add('show'); res(); }, 600);
      }
    });
  }

  /* ---------------- the whole story ---------------- */
  async function story() {
    await wait(900);
    const tuneReady = renderTune().then(b => { tuneBuf = b; });
    for (const l of CONFIG.story) await say(l, 2100);

    // the cake arrives and lights itself
    cake.classList.add('show');
    await tuneReady;
    playTune(.75);
    await wait(1400);
    for (const f of flames) { f.classList.add('lit'); lit++; setWarm(); buzz(10); await wait(450); }
    await wait(600);
    await say('Close your eyes and make a wish.', 4200, 'up');
    await say('Got it?', 1400, 'up');

    // if the phone asks about the mic, that happens before the countdown
    const heard = await askMic();
    stopTune();
    await say('Okay. Blow in', 1400, 'up');
    for (const n of ['3', '2', '1']) { buzz(15); await say(n, 650, 'up big'); }
    blowPhase = true;
    const blown = new Promise(r => { resolveBlown = r; });
    if (heard) { listen(); setHint('Blow on your phone 🌬️'); }
    else setHint('Tap the screen to blow 🌬️');
    const helpers = [
      setTimeout(() => { if (blowPhase) setHint(heard ? 'Harder! Or tap the screen' : 'Tap the screen to blow 🌬️'); }, 6000),
      setTimeout(() => {
        if (!blowPhase) return;
        setHint('Okay, I’ll help 😄');
        const iv = setInterval(() => { if (!blowPhase) clearInterval(iv); else blowOne(); }, 450);
      }, 13000)
    ];
    await blown;
    helpers.forEach(clearTimeout);
    setHint('');

    // lights out… then her name
    const cr = cake.getBoundingClientRect();
    await wait(300);
    $('#dark').style.opacity = '.65';
    await wait(1800);
    chime([784, 988, 1175, 1568]);
    nameInStars(cr.left + cr.width / 2, cr.top + cr.height * .1);
    await wait(2800);
    confetti(160, W / 2, H * .25, 1.1);
    $('#dark').style.opacity = '0';
    cake.classList.remove('show'); cake.classList.add('away');
    playTune(.6);
    await wait(1600);

    // the note, then the gift
    $('#finale').hidden = false;
    await wait(50);
    note.classList.add('show');
    await wait(3800);
    $('#giftwrap').classList.add('show');
    await holdGift();
    await wait(2500);
    $('#again').classList.add('show');
  }

  let started = false;
  addEventListener('pointerdown', (e) => {
    if (!started) {
      started = true;
      audio();
      buzz(15);
      $('#start').style.opacity = '0';
      setTimeout(() => { $('#start').hidden = true; }, 800);
      story();
      return;
    }
    if (blowPhase) { blowOne(); return; }
    if (skip && !e.target.closest('#gift')) skip();
  });
  $('#again').addEventListener('click', () => location.reload());
})();
</script>
</body>
